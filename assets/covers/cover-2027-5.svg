<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" width="100%" height="100%">
  <defs>
    <linearGradient id="spine-grad-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="3%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="6%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="10%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="allinone-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="100%" stop-color="#1d1e2c"/>
    </linearGradient>
    <filter id="soft-shadow-5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 베이스 배경: 다크 슬레이트 -->
  <rect x="0" y="0" width="240" height="330" rx="8" fill="url(#allinone-bg)"/>

  <!-- 상단 분철 탭: 1권·필기 / 2권·실기 -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="60" height="18" rx="4" fill="#48cae4" opacity="0.9"/>
    <text x="30" y="12" font-family="'NanumSquareRound', sans-serif" font-size="8" fill="#1d1e2c" text-anchor="middle" font-weight="bold">1권·필기</text>

    <rect x="66" y="0" width="60" height="18" rx="4" fill="#06d6a0"/>
    <text x="96" y="12" font-family="'NanumSquareRound', sans-serif" font-size="8" fill="#1d1e2c" text-anchor="middle" font-weight="bold">2권·실기</text>
  </g>

  <!-- 우측 상단 기특한 적중률 텍스트 -->
  <g transform="translate(170, 16)">
    <text x="25" y="10" font-family="'NanumSquareRound', sans-serif" font-size="6" fill="#a8dadc" text-anchor="middle">이렇게 기특한</text>
    <text x="25" y="18" font-family="'NanumSquareRound', sans-serif" font-size="6.5" fill="#a8dadc" text-anchor="middle" font-weight="bold">적중률</text>
  </g>

  <!-- "올인원" 청록/민트 볼드 타이포 -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="130" height="52" rx="8" fill="#000000" opacity="0.2"/>
    <text x="5" y="42" font-family="'Jua', sans-serif" font-size="44" fill="#06d6a0" letter-spacing="-1">올인원</text>
  </g>

  <!-- 우측 AI 적중 뱃지 -->
  <g transform="translate(180, 85)">
    <circle cx="20" cy="20" r="18" fill="#118ab2" filter="url(#soft-shadow-5)"/>
    <text x="20" y="16" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">AI 적중</text>
    <text x="20" y="27" font-family="'Jua', sans-serif" font-size="10" fill="#06d6a0" text-anchor="middle" font-weight="bold">합격</text>
    <!-- 유튜브 아이콘 -->
    <circle cx="20" cy="50" r="10" fill="#e63946"/>
    <polygon points="18,46 18,54 24,50" fill="#ffffff"/>
  </g>

  <!-- 서브 타이틀: 컴퓨터활용능력 1급 필기+실기 -->
  <g transform="translate(24, 130)">
    <text x="0" y="24" font-family="'Jua', sans-serif" font-size="24" fill="#ffffff">컴퓨터</text>
    <text x="0" y="52" font-family="'Jua', sans-serif" font-size="24" fill="#ffffff">활용능력</text>
    
    <rect x="0" y="64" width="128" height="24" rx="4" fill="#06d6a0"/>
    <text x="64" y="80" font-family="'Jua', sans-serif" font-size="14" fill="#1d1e2c" text-anchor="middle">1급 필기+실기</text>
  </g>

  <!-- 하단 혜택 아이콘 및 연도 바코드 -->
  <g transform="translate(24, 250)">
    <!-- 혜택 박스들 -->
    <rect x="0" y="0" width="58" height="22" rx="3" fill="#ffffff" opacity="0.1"/>
    <text x="29" y="10" font-family="'NanumSquareRound', sans-serif" font-size="6" fill="#a8dadc" text-anchor="middle">100% 무료</text>
    <text x="29" y="18" font-family="'NanumSquareRound', sans-serif" font-size="6.5" fill="#ffffff" text-anchor="middle">동영상 강의</text>

    <rect x="64" y="0" width="58" height="22" rx="3" fill="#ffffff" opacity="0.1"/>
    <text x="93" y="10" font-family="'NanumSquareRound', sans-serif" font-size="6" fill="#a8dadc" text-anchor="middle">단기 완성</text>
    <text x="93" y="18" font-family="'NanumSquareRound', sans-serif" font-size="6.5" fill="#ffffff" text-anchor="middle">CBT 모의고사</text>

    <!-- 연도 2027 -->
    <text x="195" y="15" font-family="'Jua', sans-serif" font-size="24" fill="#ffffff" text-anchor="end" font-weight="bold">2027</text>
    <text x="195" y="26" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#8d99ae" text-anchor="end">영진닷컴</text>

    <!-- 바코드 그래픽 -->
    <g transform="translate(132, 36)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
      <line x1="4" y1="0" x2="4" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.75"/>
      <line x1="8" y1="0" x2="8" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
      <line x1="14" y1="0" x2="14" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
      <line x1="18" y1="0" x2="18" y2="15" stroke="#ffffff" stroke-width="2.5" opacity="0.75"/>
      <line x1="24" y1="0" x2="24" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.75"/>
      <line x1="28" y1="0" x2="28" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
      <line x1="34" y1="0" x2="34" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
      <line x1="40" y1="0" x2="40" y2="15" stroke="#ffffff" stroke-width="2.5" opacity="0.75"/>
      <line x1="48" y1="0" x2="48" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.75"/>
      <line x1="54" y1="0" x2="54" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
      <line x1="60" y1="0" x2="60" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
    </g>
  </g>

  <!-- 책등 접지선 오버레이 -->
  <rect x="0" y="0" width="22" height="330" rx="8" fill="url(#spine-grad-teal)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="239" height="329" rx="8" fill="none" stroke="#06d6a0" stroke-opacity="0.4" stroke-width="1" pointer-events="none"/>
</svg>