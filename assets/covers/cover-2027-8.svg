<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" width="100%" height="100%">
  <defs>
    <linearGradient id="spine-grad-navy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="3%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="6%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="10%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="navy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="soft-shadow-8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 베이스 배경: 딥 네이비 -->
  <rect x="0" y="0" width="240" height="330" rx="8" fill="url(#navy-bg)"/>

  <!-- 우측 상단 기특한 적중률 & AI 배지 -->
  <g transform="translate(170, 20)">
    <text x="25" y="10" font-family="'NanumSquareRound', sans-serif" font-size="6" fill="#e0e1dd" text-anchor="middle">이렇게 기특한</text>
    <text x="25" y="18" font-family="'NanumSquareRound', sans-serif" font-size="6.5" fill="#e0e1dd" text-anchor="middle" font-weight="bold">적중률 1위</text>
    
    <circle cx="25" cy="42" r="16" fill="#415a77" filter="url(#soft-shadow-8)"/>
    <text x="25" y="38" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">AI</text>
    <text x="25" y="49" font-family="'Jua', sans-serif" font-size="9" fill="#ffd166" text-anchor="middle">자동채점</text>

    <!-- 유튜브 아이콘 -->
    <circle cx="25" cy="72" r="10" fill="#e63946"/>
    <polygon points="23,68 23,76 29,72" fill="#ffffff"/>
  </g>

  <!-- 좌측 상단: "한권 끝장" 노란색 스퀘어 뱃지와 귀여운 캐릭터 -->
  <g transform="translate(24, 25)">
    <!-- 귀여운 캐릭터 얼굴 -->
    <g transform="translate(52, -6)">
      <circle cx="16" cy="16" r="14" fill="#ffdda1"/>
      <!-- 머리카락 -->
      <path d="M 2 16 C 2 4 30 4 30 16 C 28 8 20 8 16 12 C 12 8 4 8 2 16 Z" fill="#333"/>
      <!-- 눈망울과 미소 -->
      <circle cx="11" cy="16" r="1.5" fill="#333"/>
      <circle cx="21" cy="16" r="1.5" fill="#333"/>
      <path d="M 13 20 Q 16 23 19 20" stroke="#e76f51" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- 볼터치 -->
      <circle cx="9" cy="19" r="2" fill="#ff758f" opacity="0.6"/>
      <circle cx="23" cy="19" r="2" fill="#ff758f" opacity="0.6"/>
    </g>

    <!-- 노란색 사각 블록: "한 권 끝 장" -->
    <rect x="0" y="24" width="100" height="96" rx="8" fill="#ffd166" filter="url(#soft-shadow-8)"/>
    <text x="18" y="66" font-family="'Jua', sans-serif" font-size="34" fill="#0d1b2a">한</text>
    <text x="56" y="66" font-family="'Jua', sans-serif" font-size="34" fill="#0d1b2a">권</text>
    <text x="18" y="106" font-family="'Jua', sans-serif" font-size="34" fill="#0d1b2a">끝</text>
    <text x="56" y="106" font-family="'Jua', sans-serif" font-size="34" fill="#0d1b2a">장</text>
  </g>

  <!-- 서브 타이틀: 컴퓨터활용능력 2급 실기 -->
  <g transform="translate(24, 160)">
    <rect x="0" y="0" width="192" height="42" rx="6" fill="#ffffff" opacity="0.12"/>
    <text x="12" y="18" font-family="'NanumSquareRound', 'Jua', sans-serif" font-size="11" fill="#ffd166" font-weight="bold">컴퓨터활용능력</text>
    <text x="12" y="34" font-family="'Jua', sans-serif" font-size="14" fill="#ffffff">2급 실기 [초단기 합격]</text>
  </g>

  <!-- 하단 혜택 아이콘 및 연도 바코드 -->
  <g transform="translate(24, 235)">
    <rect x="0" y="0" width="95" height="15" rx="3" fill="#ffffff" opacity="0.1"/>
    <text x="47" y="11" font-family="'NanumSquareRound', sans-serif" font-size="7.5" fill="#ffd166" text-anchor="middle">단기 완성 핵심요약</text>

    <rect x="100" y="0" width="95" height="15" rx="3" fill="#ffffff" opacity="0.1"/>
    <text x="147" y="11" font-family="'NanumSquareRound', sans-serif" font-size="7.5" fill="#a8dadc" text-anchor="middle">채점프로그램 즉시채점</text>

    <text x="2" y="34" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#e0e1dd">✔ 빈출 유형별 문제 압축 정리</text>
    <text x="2" y="46" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#e0e1dd">✔ 저자 직강 유튜브 무료 강의</text>

    <!-- 연도 2027 -->
    <text x="195" y="45" font-family="'Jua', sans-serif" font-size="24" fill="#ffffff" text-anchor="end" font-weight="bold">2027</text>
    <text x="195" y="55" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#778da9" text-anchor="end">영진닷컴</text>

    <!-- 바코드 그래픽 -->
    <g transform="translate(132, 60)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <line x1="4" y1="0" x2="4" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
      <line x1="8" y1="0" x2="8" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <line x1="14" y1="0" x2="14" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <line x1="18" y1="0" x2="18" y2="15" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <line x1="24" y1="0" x2="24" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
      <line x1="28" y1="0" x2="28" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <line x1="34" y1="0" x2="34" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <line x1="40" y1="0" x2="40" y2="15" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <line x1="48" y1="0" x2="48" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
      <line x1="54" y1="0" x2="54" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <line x1="60" y1="0" x2="60" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>

  <!-- 책등 접지선 오버레이 -->
  <rect x="0" y="0" width="22" height="330" rx="8" fill="url(#spine-grad-navy)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="239" height="329" rx="8" fill="none" stroke="#ffd166" stroke-opacity="0.4" stroke-width="1" pointer-events="none"/>
</svg>