<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" width="100%" height="100%">
  <defs>
    <!-- 책등(Spine) 그림자 및 하이라이트 -->
    <linearGradient id="spine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="3%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="6%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="10%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
    <linearGradient id="art-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eddcd2"/>
      <stop offset="50%" stop-color="#ddbea9"/>
      <stop offset="100%" stop-color="#cb997e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 책 표지 베이스 -->
  <rect x="0" y="0" width="240" height="330" rx="8" fill="url(#bg-grad-1)"/>

  <!-- 상단 장식 및 뱃지 -->
  <circle cx="32" cy="30" r="14" fill="#3a405a" />
  <text x="32" y="27" font-family="'Jua', 'NanumSquareRound', sans-serif" font-size="8" fill="#ffb4a2" text-anchor="middle" font-weight="bold">AI</text>
  <text x="32" y="37" font-family="'NanumSquareRound', sans-serif" font-size="6" fill="#fff" text-anchor="middle">적중분석</text>

  <!-- 우측 상단 기특한 적중률 말풍선 -->
  <rect x="168" y="18" width="56" height="24" rx="4" fill="#6b705c" opacity="0.9"/>
  <text x="196" y="29" font-family="'Jua', 'NanumSquareRound', sans-serif" font-size="7" fill="#fff" text-anchor="middle">이렇게 기특한</text>
  <text x="196" y="38" font-family="'Jua', 'NanumSquareRound', sans-serif" font-size="8" fill="#ffe6a7" text-anchor="middle" font-weight="bold">적중률 1위</text>

  <!-- 중앙 명화/일러스트 프레임 (파스텔 명화 감성) -->
  <g transform="translate(20, 52)">
    <rect x="0" y="0" width="200" height="135" rx="6" fill="url(#art-grad-1)" filter="url(#soft-shadow)"/>
    
    <!-- 액자 속 일러스트 요소: 감성적인 실내 창문과 앤틱 가구 & 꽃 -->
    <rect x="10" y="10" width="180" height="115" rx="4" fill="#faedcd" opacity="0.4"/>
    <!-- 아치형 창문 -->
    <path d="M 130 95 L 130 35 A 25 25 0 0 1 180 35 L 180 95 Z" fill="#b7b7a4" opacity="0.5"/>
    <circle cx="155" cy="40" r="12" fill="#ffe5d9" opacity="0.8"/>
    <!-- 감성 실루엣 (책을 읽는 모습) -->
    <ellipse cx="65" cy="55" rx="14" ry="16" fill="#6b705c" opacity="0.75"/>
    <ellipse cx="65" cy="40" rx="9" ry="10" fill="#a5a58d" opacity="0.85"/>
    <path d="M 45 105 C 50 75, 80 75, 85 105 Z" fill="#a5a58d" opacity="0.9"/>
    <!-- 꽃병과 작은 튤립 -->
    <path d="M 148 100 Q 155 85 162 100 Z" fill="#ddbea9"/>
    <circle cx="155" cy="80" r="5" fill="#f28482"/>
    <line x1="155" y1="85" x2="155" y2="100" stroke="#84a59d" stroke-width="2"/>
    <text x="100" y="122" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#7f5539" text-anchor="middle" letter-spacing="1">CLASSIC EDITION</text>
  </g>

  <!-- 타이틀 박스: 컴퓨터활용능력 1급 실기 -->
  <g transform="translate(18, 175)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="204" height="42" rx="6" fill="#ffffff" stroke="#e07a5f" stroke-width="1.8"/>
    <text x="12" y="18" font-family="'NanumSquareRound', 'Jua', sans-serif" font-size="10" fill="#666" font-weight="bold">컴퓨터활용능력</text>
    <rect x="12" y="23" width="70" height="14" rx="3" fill="#e07a5f"/>
    <text x="47" y="34" font-family="'Jua', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">1급 실기</text>
    <text x="90" y="34" font-family="'Jua', sans-serif" font-size="10" fill="#3d405b">기본서 [스프레드시트·데이터베이스]</text>
  </g>

  <!-- 하단 수험 정보 및 바코드 -->
  <g transform="translate(20, 235)">
    <!-- 태그들 -->
    <rect x="0" y="0" width="95" height="15" rx="3" fill="#f4f1de"/>
    <text x="47" y="11" font-family="'NanumSquareRound', sans-serif" font-size="7.5" fill="#3d405b" text-anchor="middle">최신 개정판 이론+기출</text>

    <rect x="100" y="0" width="95" height="15" rx="3" fill="#f4f1de"/>
    <text x="147" y="11" font-family="'NanumSquareRound', sans-serif" font-size="7.5" fill="#e07a5f" text-anchor="middle">채점프로그램 완벽연동</text>

    <!-- 혜택 체크리스트 -->
    <text x="2" y="34" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#555">✔ 100% 무료 동영상 강의</text>
    <text x="2" y="46" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#555">✔ 기출 변형 모의고사 10회</text>

    <!-- 연도 2027 강조 -->
    <text x="195" y="45" font-family="'Jua', sans-serif" font-size="24" fill="#3d405b" text-anchor="end" font-weight="bold">2027</text>
    <text x="195" y="55" font-family="'NanumSquareRound', sans-serif" font-size="7" fill="#888" text-anchor="end">YOUNGJIN.COM</text>

    <!-- 바코드 그래픽 -->
    <g transform="translate(130, 60)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#333" stroke-width="1.5"/>
      <line x1="4" y1="0" x2="4" y2="15" stroke="#333" stroke-width="1"/>
      <line x1="7" y1="0" x2="7" y2="15" stroke="#333" stroke-width="2"/>
      <line x1="12" y1="0" x2="12" y2="15" stroke="#333" stroke-width="1"/>
      <line x1="16" y1="0" x2="16" y2="15" stroke="#333" stroke-width="2.5"/>
      <line x1="22" y1="0" x2="22" y2="15" stroke="#333" stroke-width="1"/>
      <line x1="26" y1="0" x2="26" y2="15" stroke="#333" stroke-width="1.5"/>
      <line x1="31" y1="0" x2="31" y2="15" stroke="#333" stroke-width="2"/>
      <line x1="37" y1="0" x2="37" y2="15" stroke="#333" stroke-width="1"/>
      <line x1="42" y1="0" x2="42" y2="15" stroke="#333" stroke-width="2"/>
      <line x1="48" y1="0" x2="48" y2="15" stroke="#333" stroke-width="1"/>
      <line x1="54" y1="0" x2="54" y2="15" stroke="#333" stroke-width="2.5"/>
      <line x1="60" y1="0" x2="60" y2="15" stroke="#333" stroke-width="1"/>
    </g>
  </g>

  <!-- 책등 접지선(스파인) 오버레이 -->
  <rect x="0" y="0" width="22" height="330" rx="8" fill="url(#spine-grad)" pointer-events="none"/>
  <!-- 책 테두리 섬세한 라인 -->
  <rect x="0.5" y="0.5" width="239" height="329" rx="8" fill="none" stroke="#e0d6c8" stroke-width="1" pointer-events="none"/>
</svg>