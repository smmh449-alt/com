<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" width="100%" height="100%">
  <defs>
    <linearGradient id="ready-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4f1ea"/>
    </linearGradient>
  </defs>

  <!-- 외곽 점선 프레임 -->
  <rect x="6" y="6" width="228" height="318" rx="12" fill="url(#ready-bg)" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- 중앙 몽글몽글 시계 일러스트 -->
  <g transform="translate(120, 140)">
    <!-- 몽글몽글 구름 그림자 -->
    <ellipse cx="0" cy="48" rx="42" ry="10" fill="#e2e8f0" opacity="0.6"/>

    <!-- 시계 몸체 -->
    <circle cx="0" cy="0" r="38" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="0" cy="0" r="32" fill="#f8fafc"/>
    
    <!-- 시계 눈금 -->
    <circle cx="0" cy="-24" r="2.5" fill="#64748b"/>
    <circle cx="24" cy="0" r="2.5" fill="#64748b"/>
    <circle cx="0" cy="24" r="2.5" fill="#64748b"/>
    <circle cx="-24" cy="0" r="2.5" fill="#64748b"/>

    <!-- 귀여운 시계 바늘 -->
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="8" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4.5" fill="#1e293b"/>

    <!-- 귀여운 반짝이 별들 -->
    <path d="M -30 -30 Q -24 -24 -30 -18 Q -36 -24 -30 -30 Z" fill="#fbbf24"/>
    <path d="M 32 -25 Q 36 -20 32 -15 Q 28 -20 32 -25 Z" fill="#fbbf24"/>
    <!-- 미니 튤립 -->
    <g transform="translate(30, 25)">
      <circle cx="0" cy="0" r="4" fill="#f472b6"/>
      <path d="M 0 3 L 0 12" stroke="#4ade80" stroke-width="1.8"/>
    </g>
  </g>

  <!-- 텍스트: 교재 준비중... -->
  <text x="120" y="210" font-family="'Jua', sans-serif" font-size="18" fill="#64748b" text-anchor="middle">교재 준비중...</text>
  <text x="120" y="230" font-family="'NanumSquareRound', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">더 완벽한 교재로 곧 찾아뵙겠습니다</text>
  
  <rect x="80" y="244" width="80" height="20" rx="10" fill="#e2e8f0"/>
  <text x="120" y="258" font-family="'Jua', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">COMING SOON</text>
</svg>